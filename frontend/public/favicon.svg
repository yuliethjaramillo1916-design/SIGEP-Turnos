<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Cuerpo del calendario -->
  <rect x="3" y="8" width="26" height="21" rx="3" stroke="white" stroke-width="2" fill="none"/>

  <!-- Cabecera (banda superior) -->
  <rect x="3" y="8" width="26" height="8" rx="3" fill="white" fill-opacity="0.2"/>
  <rect x="3" y="13" width="26" height="3" fill="white" fill-opacity="0.2"/>

  <!-- Argollas -->
  <line x1="10" y1="4" x2="10" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="4" x2="22" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Días en cuadrícula -->
  <circle cx="9"  cy="21" r="1.5" fill="white" fill-opacity="0.9"/>
  <circle cx="16" cy="21" r="1.5" fill="white" fill-opacity="0.9"/>
  <circle cx="23" cy="21" r="1.5" fill="white" fill-opacity="0.9"/>
  <circle cx="9"  cy="26" r="1.5" fill="white" fill-opacity="0.6"/>
  <circle cx="16" cy="26" r="1.5" fill="white" fill-opacity="0.6"/>
  <circle cx="23" cy="26" r="1.5" fill="white" fill-opacity="0.6"/>
</svg>
